- date: '2010-07-17'
  title: Addition of Checkpoints
  kind: soft
  body: <figure><blockquote><p>I'll probably put a checkpoint in each version from now on.  Once the software has
    settled what the widely accepted block chain is, there's no point in leaving open the unwanted non-zero possibility
    of revision months later.</p></blockquote><figcaption>Satoshi Nakamoto</figcaption></figure>
