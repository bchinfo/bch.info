- date: '2013-03-11'
  title: Unexpected Hard Fork/Chain Split
  kind: other
  body: <p>A block that had a larger number of total transaction inputs than previously seen was mined and broadcasted.
    Bitcoin 0.8 nodes were able to handle this, but some pre-0.8 Bitcoin nodes rejected it, causing an unexpected
    fork of the blockchain. The issue stemmed from differences between BerkeleyDB and LevelDB. Miners switched back
    to the older version to resolve the fork and 0.8.1 was released with new limits to prevent this from reoccuring.</p>
- date: '2013-02-19'
  title: Migration from BerkeleyDB to LevelDB
  kind: other
  body: <p>Ultraprune is implemented, separating the UTXO set from the blockchain database.</p>
- date: '2012-09-17'
  title: BIP 22, 34 & 35
  kind: soft
  body: '<p>BIP 22: Defines "getblocktemplate" to replace "getwork" enabling miners to have more control over transactions
    included in a block.</p><p>BIP 34: New rule requiring block height to be included in the coinbase transaction
    of each block allowing each block to be uniquely identified, also addressing potential issues with duplicate
    coinbase transactions.</p><p>BIP 35: New "mempool" RPC command allowing users to query the mempool of unconfirmed
    transactions enhancing communication between nodes and clients, particularly useful for wallets or block explorers
    requiring real-time data.</p>'
- date: '2012-04-01'
  title: Pay-to-Script-Hash
  kind: soft
- date: '2012-03-30'
  title: Security and DoS Fixes
  kind: soft
  body: <p>Implementation of BIP 30 (a security fix for an attack involving duplicate coinbase transactions) and
    fixes for memory related denial-of-serivice attacks.</p>
- date: '2012-03-15'
  title: Disallow Transactions with Same TXID
  kind: soft
- date: '2010-12-12'
  title: Addition of DoS limits & Removal of Alert System
  kind: soft
- date: '2010-10-12'
  title: 1MB Block Size Limit
  kind: soft
  body: <figure><blockquote><p>The limit was originally Hal Finney’s idea. Both Satoshi and I objected that it wouldn’t
    scale at 1MB. Hal was concerned about a potential DoS attack though, and after discussion, Satoshi agreed...
    But all 3 of us agreed that 1MB had to be temporary because it would never scale.</p></blockquote><figcaption>Ray
    Dillinger</figcaption></figure><figure><blockquote><p>The plan from the begining was to support huge blocks.
    The 1MB hard limit was always a temporary denial-of-service prevention measure.</p></blockquote><figcaption>Gavin
    Andresen</figcaption></figure><figure><blockquote><p>It can be phased in, like:<br>if (blocknumber > 115000)<br>maxblocksize
    = largerlimit</p></blockquote><figcaption>Satoshi Nakamoto</figcaption></figure>
- date: '2010-07-17'
  title: Addition of Alert System
  kind: soft
  body: <figure><blockquote><p>I've been working on writing the alert system. Alerts are broadcast through the network
    and apply to a range of version numbers. Alert messages are signed with a private key that only I have.<br>Getting
    surprised by some temporary down time when your node would otherwise be at risk is better than getting surprised
    by a thief draining all your inventory.</p></blockquote><figcaption>Satoshi Nakamoto</figcaption></figure>
- date: '2010-08-15'
  title: Value Overflow Incident
  kind: soft
  body: <p>Satoshi pushes fix and tells users and miners to re-org the block with the overflowed transaction out
    of history.</p>
