# Netlify build settings.

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.170.0"

# Deploy previews and branch deploys use their own address, not bch.info.
[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

# Images and downloads used to live under /static/.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 301

# Send visitors to the homepage in their browser's language, or to the English
# one.

[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = true
  conditions = {Language = ["zh"]}

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  force = true
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  force = true
  conditions = {Language = ["it"]}

[[redirects]]
  from = "/"
  to = "/ja/"
  status = 302
  force = true
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  force = true
  conditions = {Language = ["pt"]}

[[redirects]]
  from = "/"
  to = "/th/"
  status = 302
  force = true
  conditions = {Language = ["th"]}

[[redirects]]
  from = "/"
  to = "/pl/"
  status = 302
  force = true
  conditions = {Language = ["pl"]}

[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302
  force = true
  conditions = {Language = ["ru"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

