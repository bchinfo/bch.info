<header class="site-header">
<div class="site-header__inner">
<a class="brand" href="{{ "" | relLangURL }}">{{ partial "logo.html" . }}</a>
<nav class="site-nav">
{{- range site.Menus.main }}
<a href="{{ partial "href.html" . }}">{{ partial "t.html" .Params.t }}</a>
{{- end }}
</nav>
<div class="site-actions">
{{- /* Shown by assets/js/theme.js, which also makes it work. */}}
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" hidden>
<svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M16.5 11.6A6.75 6.75 0 0 1 8.4 3.5a6.75 6.75 0 1 0 8.1 8.1z"/></svg>
<svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.75v2M10 16.25v2M1.75 10h2M16.25 10h2M4.17 4.17l1.41 1.41M14.42 14.42l1.41 1.41M4.17 15.83l1.41-1.41M14.42 5.58l1.41-1.41"/></svg>
</button>
<a class="btn btn--light" href="{{ "#get-started" | relLangURL }}" data-jump>{{ partial "t.html" "index.get-started" }}</a>
</div>
</div>
</header>
