<footer class="site-footer">
{{- $here := .RelPermalink }}
<div class="site-footer__groups">
{{- range partial "nav-groups.html" . }}
<nav>
<h2>{{ .heading }}</h2>
{{- range .items }}
{{ partial "nav-item.html" (dict "item" . "here" $here) }}
{{- end }}
</nav>
{{- end }}
</div>
<nav class="site-footer__languages">
{{- range .AllTranslations }}
<a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}"{{ if eq .Language.Lang site.Language.Lang }} aria-current="true"{{ end }}>{{ .Language.Label }}</a>
{{- end }}
</nav>
</footer>
