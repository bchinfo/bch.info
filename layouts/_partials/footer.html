<footer class="site-footer">
{{- $here := .RelPermalink }}
<div class="site-footer__groups">
{{- range partial "nav-groups.html" . }}
<nav>
<h2>{{ .heading }}</h2>
{{- range .items }}
{{ partial "nav-item.html" (dict "item" . "here" $here) }}
{{- end }}
</nav>
{{- end }}
</div>
<div class="site-footer__languages">
{{ partial "lang-picker.html" (dict "page" . "up" true) }}
</div>
</footer>
